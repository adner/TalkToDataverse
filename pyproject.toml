[project]
name = "speed-of-thought"
version = "0.1.0"
description = "Speech to Dataverse actions: per-word Decision-1 intent and parallel L2 flights."
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "agent-framework-ag-ui==1.0.1",
  "agent-framework-core==1.13.0",
  "azure-identity==1.25.3",
  "fastapi==0.139.2",
  "httpx==0.28.1",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
l0 = [
  "accelerate==1.14.0",
  "librosa==0.11.0",
  "numba==0.66.0",
  "numpy==2.4.6",
  "sounddevice==0.5.5",
  "soundfile==0.14.0",
  "soxr==1.1.0",
  "torch==2.9.1+cu128",
  "transformers==5.15.0",
]
l2 = [
  "agent-framework-openai==1.12.0",
]
live = [
  "accelerate==1.14.0",
  "agent-framework-openai==1.12.0",
  "librosa==0.11.0",
  "numba==0.66.0",
  "numpy==2.4.6",
  "sounddevice==0.5.5",
  "soundfile==0.14.0",
  "soxr==1.1.0",
  "torch==2.9.1+cu128",
  "transformers==5.15.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.7",
]

[project.scripts]
sot-backend = "sot_agent.main:run"
sot-reset = "sot_dataverse.reset:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sot_streamer", "src/sot_intent", "src/sot_agent", "src/sot_dataverse"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
